name: 🏥 Scrape Doctor Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    name: Fetch & Update doctors.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scraper.py
        continue-on-error: true

      - name: Show result
        run: |
          if [ -f doctors.json ]; then
            python -c "import json; d=json.load(open('doctors.json')); print(f'Total doctors: {d[\"count\"]}')"
          else
            echo "doctors.json not created"
          fi

      - name: Commit updated doctors.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doctors.json
          git diff --cached --quiet || git commit -m "🔄 Auto-update doctors.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
