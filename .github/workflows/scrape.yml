name: 🏥 Scrape Doctor Data

# ── Schedule: runs every 6 hours ─────────────────────────────────────────────
# To change frequency, edit the cron expression below:
#   "0 */6 * * *"  = every 6 hours
#   "0 */12 * * *" = every 12 hours
#   "0 2 * * *"    = once daily at 2 AM UTC
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:            # also allow manual trigger from GitHub UI

jobs:
  scrape:
    name: Fetch & Update doctors.json
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write            # needed to commit doctors.json back to repo

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml playwright

      # ── 3b. Install Playwright browser ───────────────────────────────────────
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 4. Run scraper ────────────────────────────────────────────────────────
      - name: Run scraper
        run: python scraper.py
        continue-on-error: true   # don't fail the whole workflow if scraping is blocked

      # ── 5. Show result ───────────────────────────────────────────────────────
      - name: Show doctors.json summary
        run: |
          if [ -f doctors.json ]; then
            echo "✅ doctors.json created"
            python -c "import json; d=json.load(open('doctors.json')); print(f'  Total doctors: {d[\"count\"]}'); print(f'  Updated: {d[\"updated\"]}')"
          else
            echo "⚠️  doctors.json not created — scraping may have been blocked"
          fi

      # ── 6. Commit & push if file changed ────────────────────────────────────�