name: Deploy Al-Falah Academy to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'noor-academy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload noor-academy folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './noor-academy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
